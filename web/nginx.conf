server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the server container (set API_HOST via a template if needed).
  location /api/ {
    proxy_pass http://app:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /prototype/ {
    proxy_pass http://app:4000;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
