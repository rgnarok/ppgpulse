services:
  db:
    image: postgres:16-alpine
    container_name: ppg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppg
      POSTGRES_PASSWORD: ppg
      POSTGRES_DB: ppgpulse
    ports:
      - '5432:5432'
    volumes:
      - ppg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ppg -d ppgpulse']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppg-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://ppg:ppg@db:5432/ppgpulse
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-01}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production-please-02}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4000}
      UPLOAD_DIR: /app/server/uploads
      SEED_ON_BOOT: 'true'
    ports:
      - '4000:4000'
    volumes:
      - ppg-uploads:/app/server/uploads

volumes:
  ppg-pgdata:
  ppg-uploads:
