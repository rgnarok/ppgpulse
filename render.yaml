# Render Blueprint — one-click deploy of PPG Pulse (API + web) with Postgres.
# In the Render dashboard: New → Blueprint → connect this repo/branch. Render
# provisions the database, injects DATABASE_URL, generates the JWT secrets, builds
# both workspaces, applies the schema + seed, and serves the app single-origin at
# https://<service>.onrender.com.
databases:
  - name: ppg-postgres
    databaseName: ppgpulse
    user: ppg
    plan: free

services:
  - type: web
    name: ppg-pulse
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    # Build only (no DB access — DATABASE_URL is not injected at build time).
    buildCommand: npm ci && npm run build
    # At runtime DATABASE_URL is available: sync the schema, seed (idempotent),
    # then serve the API (which also serves web/dist single-origin).
    startCommand: npm run db:push -w server && npm run seed && node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      - key: DATABASE_URL
        fromDatabase:
          name: ppg-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /opt/render/project/src/server/uploads
      - key: MAX_UPLOAD_BYTES
        value: '10485760'
      # WEB_ORIGIN falls back to RENDER_EXTERNAL_URL automatically (single origin).
