# Render Blueprint — one-click deploy of PPG Pulse (API + web) with Postgres.
# In the Render dashboard: New → Blueprint → connect this repo. Render provisions
# the database and the web service, injects DATABASE_URL, generates the JWT
# secrets, and serves the app at https://<service>.onrender.com.
databases:
  - name: ppg-postgres
    databaseName: ppgpulse
    user: ppg
    plan: free

services:
  - type: web
    name: ppg-pulse
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      - key: DATABASE_URL
        fromDatabase:
          name: ppg-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/server/uploads
      - key: MAX_UPLOAD_BYTES
        value: '10485760'
      # WEB_ORIGIN falls back to RENDER_EXTERNAL_URL automatically (single origin).
      - key: SEED_ON_BOOT
        value: 'true'
